name: Test Pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, turn]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Go vet
        run: |
          cd ${{ matrix.service }}
          go vet ./...

      - name: Go test (with race detector)
        run: |
          cd ${{ matrix.service }}
          go test -race -v ./...

  test-frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Next.js Production Build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  test-embed:
    name: Embed Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: embed/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r embed/requirements.txt pytest httpx

      - name: Run Python unit tests
        run: |
          pytest embed/test_app.py -v

  docker-compose-verification:
    name: Docker Stack Verification
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-embed]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose Configurations
        run: |
          docker compose config -q
          docker compose -f compose.test.yaml --profile test config -q
          docker compose -f compose.release.yaml config -q
          echo "All compose configurations valid!"

      - name: Build Core Services (Fast check)
        run: |
          docker compose build migrate server turn web
