# ==============================================================================
# Roomie GitLab CI/CD Pipeline
# Includes: Multi-service Test Suite, Docker Multi-Image Builds, Container Registry,
# and Automated GitLab Release Packaging.
# ==============================================================================

stages:
  - test
  - build
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"
  GOPATH: "$CI_PROJECT_DIR/.go"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  interruptible: true

# ==============================================================================
# STAGE: TEST
# ==============================================================================

test:backend:
  stage: test
  image: golang:1.24-alpine
  cache:
    key: "go-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - .go/pkg/mod/
  before_script:
    - apk add --no-cache git build-base
  script:
    - echo "Testing Server..."
    - cd server
    - go vet ./...
    - go test -race -v ./...
    - echo "Testing TURN..."
    - cd ../turn
    - go vet ./...
    - go test -race -v ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:frontend:
  stage: test
  image: node:24-alpine
  cache:
    key: "npm-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm/
  script:
    - cd web
    - npm ci
    - npm run typecheck
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:embed:
  stage: test
  image: python:3.11-slim
  cache:
    key: "pip-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip/
  script:
    - cd embed
    - pip install --no-cache-dir -r requirements.txt pytest httpx
    - pytest test_app.py -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:docker-config:
  stage: test
  image: docker:27-cli
  script:
    - docker compose config -q
    - docker compose -f compose.test.yaml --profile test config -q
    - docker compose -f compose.release.yaml config -q
    - echo "All Docker Compose configurations are valid!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ==============================================================================
# STAGE: BUILD (Docker Images)
# ==============================================================================

.docker_build_template:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      IMAGE_URI="${CI_REGISTRY_IMAGE}/${SERVICE_NAME}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="-t ${IMAGE_URI}:${CI_COMMIT_TAG} -t ${IMAGE_URI}:latest"
      elif [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        TAGS="-t ${IMAGE_URI}:latest -t ${IMAGE_URI}:${CI_COMMIT_SHORT_SHA}"
      else
        TAGS="-t ${IMAGE_URI}:${CI_COMMIT_REF_SLUG} -t ${IMAGE_URI}:${CI_COMMIT_SHORT_SHA}"
      fi
  script:
    - echo "Building Docker image for ${SERVICE_NAME}..."
    - |
      docker build \
        --cache-from "${IMAGE_URI}:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        ${BUILD_ARGS} \
        -f "${DOCKERFILE}" \
        ${TAGS} \
        "${CONTEXT}"
    - |
      for tag in ${TAGS}; do
        if [ "$tag" != "-t" ]; then
          echo "Pushing $tag ..."
          docker push "$tag"
        fi
      done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

docker:server:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: "roomie-server"
    CONTEXT: "server"
    DOCKERFILE: "infra/docker/go.Dockerfile"
    BUILD_ARGS: "--build-arg TARGET=./cmd/server"

docker:turn:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: "roomie-turn"
    CONTEXT: "turn"
    DOCKERFILE: "infra/docker/go.Dockerfile"
    BUILD_ARGS: "--build-arg TARGET=./cmd/main.go"

docker:migrate:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: "roomie-migrate"
    CONTEXT: "server"
    DOCKERFILE: "infra/docker/go.Dockerfile"
    BUILD_ARGS: "--build-arg TARGET=./cmd/migrate"

docker:web:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: "roomie-web"
    CONTEXT: "web"
    DOCKERFILE: "infra/docker/web.Dockerfile"
    BUILD_ARGS: ""

docker:embed:
  extends: .docker_build_template
  variables:
    SERVICE_NAME: "roomie-embed"
    CONTEXT: "embed"
    DOCKERFILE: "embed/Dockerfile"
    BUILD_ARGS: ""

# ==============================================================================
# STAGE: RELEASE (GitLab Release on Tags)
# ==============================================================================

release:package:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  before_script:
    - apk add --no-cache tar gzip
  script:
    - echo "Packaging release bundle for ${CI_COMMIT_TAG}..."
    - mkdir -p dist
    - |
      tar -czvf "dist/roomie-release-${CI_COMMIT_TAG}.tar.gz" \
        compose.release.yaml \
        .env.example \
        LICENSE \
        README.md \
        infra/proxy/Caddyfile
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG}..."
  artifacts:
    name: "roomie-release-${CI_COMMIT_TAG}"
    paths:
      - dist/roomie-release-${CI_COMMIT_TAG}.tar.gz
    expire_in: never
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Roomie Release $CI_COMMIT_TAG'
    description: |
      ## Roomie Production Release $CI_COMMIT_TAG
      
      Automated release containing pre-built container configurations and deployment assets.
      
      ### Pre-Built Docker Images (GitLab Container Registry)
      - `${CI_REGISTRY_IMAGE}/roomie-server:${CI_COMMIT_TAG}`
      - `${CI_REGISTRY_IMAGE}/roomie-web:${CI_COMMIT_TAG}`
      - `${CI_REGISTRY_IMAGE}/roomie-turn:${CI_COMMIT_TAG}`
      - `${CI_REGISTRY_IMAGE}/roomie-migrate:${CI_COMMIT_TAG}`
      - `${CI_REGISTRY_IMAGE}/roomie-embed:${CI_COMMIT_TAG}`
      
      ### Quick Deployment
      ```bash
      tar -xzvf roomie-release-${CI_COMMIT_TAG}.tar.gz
      cp .env.example .env
      docker compose -f compose.release.yaml up -d
      ```
