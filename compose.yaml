name: roomie

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roomie}
      POSTGRES_USER: ${POSTGRES_USER:-roomie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomie_secure_pass_9281}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [roomie-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./server
      dockerfile: ../infra/docker/go.Dockerfile
      args: { TARGET: ./cmd/migrate }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-roomie}:${POSTGRES_PASSWORD:-roomie_secure_pass_9281}@postgres:5432/${POSTGRES_DB:-roomie}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  embedding:
    build:
      context: ./embed
      dockerfile: Dockerfile
    environment:
      MODEL_NAME: Alibaba-NLP/gte-Qwen2-1.5B-instruct
      PORT: 8000
    volumes:
      - roomie-hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: ../infra/docker/go.Dockerfile
      args: { TARGET: ./cmd/server }
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-roomie}:${POSTGRES_PASSWORD:-roomie_secure_pass_9281}@postgres:5432/${POSTGRES_DB:-roomie}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_SERVICE_URL: http://embedding:8000/embed
      TURN_SECRET: ${TURN_SECRET:-roomie_turn_hmac_secret_key_32_chars_long}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-13.234.238.124}
      TURN_PORT: ${TURN_PORT:-3478}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 4s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  turn:
    build:
      context: ./turn
      dockerfile: ../infra/docker/go.Dockerfile
      args: { TARGET: ./cmd/main.go }
    network_mode: host
    environment:
      TURN_LISTEN_ADDR: :3478
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-13.234.238.124}
      TURN_REALM: roomie.turn
      TURN_SECRET: ${TURN_SECRET:-roomie_turn_hmac_secret_key_32_chars_long}
      TURN_RELAY_MIN: 49160
      TURN_RELAY_MAX: 49180
      TURN_HEALTH_ADDR: 127.0.0.1:8082
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
      interval: 4s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../infra/docker/web.Dockerfile
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web: { condition: service_started }
      server: { condition: service_healthy }
    restart: unless-stopped

volumes:
  roomie-postgres-data:
  roomie-hf-cache:
