<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffaf94" />
      <stop offset="50%" stop-color="#ff8e68" />
      <stop offset="100%" stop-color="#ea5830" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff5f0" />
    </linearGradient>
    <filter id="shadow" x="14" y="24" width="100" height="84" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#8a2a0a" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />

  <!-- Inner Soft Bevel Highlight -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="26.5" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" />

  <!-- Friendly Multi-Party Speech & Video Camera Icon -->
  <g filter="url(#shadow)">
    <!-- Back Chat Bubble (Sage Green accent representing peers) -->
    <path d="M72 40H88C95.732 40 102 46.268 102 54V66C102 73.732 95.732 80 88 80H85L80 87V80H72C64.268 80 58 73.732 58 66V54C58 46.268 64.268 40 72 40Z" fill="#a7d7c5" />

    <!-- Main Front Video Camera Bubble -->
    <rect x="26" y="44" width="48" height="38" rx="13" fill="url(#bubbleGrad)" />
    <!-- Speech bubble pointer -->
    <path d="M38 81L32 90V81H38Z" fill="url(#bubbleGrad)" />

    <!-- Camera Lens Triangle (Pointing right) -->
    <path d="M74 54.5L88 46V79.5L74 71V54.5Z" fill="#ffffff" />

    <!-- Central Camera Lens / Shutter Dot in Dark Warm Clay -->
    <circle cx="50" cy="63" r="8.5" fill="#ff7f54" />
    <circle cx="50" cy="63" r="4.5" fill="#381c14" />
    <!-- White Glint -->
    <circle cx="52" cy="61" r="1.5" fill="#ffffff" />
  </g>

  <!-- Live Sparkle / Connected Indicator -->
  <circle cx="94" cy="34" r="5" fill="#ffffff" />
  <circle cx="94" cy="34" r="3.5" fill="#22c55e" />
</svg>
