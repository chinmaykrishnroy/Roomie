<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    :root {
      --visor-frame: #00f0ff;
      --visor-lens: #00f0ff;
      --visor-bg: #07080b;
      --visor-pupil: #ff0055;
      --visor-beam: #00ff66;
      --visor-brow: #ff0055;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --visor-frame: #050811;
        --visor-lens: #050811;
        --visor-bg: #ffffff;
        --visor-pupil: #ff0055;
        --visor-beam: #00e5ff;
        --visor-brow: #ff0055;
      }
    }
  </style>

  <!-- Outer Visor Frame -->
  <path
    d="M28 42 L44 32 H84 L100 42 L114 58 L114 76 L98 94 H78 L64 80 L50 94 H30 L14 76 L14 58 Z"
    fill="var(--visor-frame)"
  />

  <!-- Inner Visor Cutout -->
  <path
    d="M32 46 L46 38 H82 L96 46 L106 60 L106 72 L94 88 H76 L64 76 L52 88 H34 L22 72 L22 60 Z"
    fill="var(--visor-bg)"
  />

  <!-- Top Brow Status Light -->
  <rect x="50" y="42" width="28" height="4" rx="2" fill="var(--visor-brow)" />

  <!-- Left Camera Eye -->
  <circle cx="44" cy="63" r="13" fill="var(--visor-lens)" />
  <circle cx="44" cy="63" r="7" fill="var(--visor-bg)" />
  <circle cx="44" cy="63" r="3.5" fill="var(--visor-pupil)" />

  <!-- Right Camera Eye -->
  <circle cx="84" cy="63" r="13" fill="var(--visor-lens)" />
  <circle cx="84" cy="63" r="7" fill="var(--visor-bg)" />
  <circle cx="84" cy="63" r="3.5" fill="var(--visor-pupil)" />

  <!-- Connection Bridge / Beam -->
  <rect x="58" y="60.5" width="12" height="5" rx="2.5" fill="var(--visor-beam)" />
</svg>
