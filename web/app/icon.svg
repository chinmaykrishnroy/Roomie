<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    :root {
      --icon-body: #00f0ff;
      --icon-cutout: #07080b;
      --icon-iris: #ff0055;
      --icon-beacon: #00ff66;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --icon-body: #0d1117;
        --icon-cutout: #ffffff;
        --icon-iris: #0066ee;
        --icon-beacon: #00b341;
      }
    }
  </style>

  <!-- Main Camera Talk Bubble Body -->
  <path
    d="M30 34H68C74.6274 34 80 39.3726 80 46V74C80 80.6274 74.6274 86 68 86H42L24 100V86C20.6863 86 18 83.3137 18 80V46C18 39.3726 23.3726 34 30 34Z"
    fill="var(--icon-body)"
  />

  <!-- Camera Lens Cone -->
  <path
    d="M84 48L106 34C108.5 32.5 112 34.3 112 37.3V80.7C112 83.7 108.5 85.5 106 84L84 70V48Z"
    fill="var(--icon-body)"
  />

  <!-- Center Aperture Cutout -->
  <circle cx="49" cy="60" r="13" fill="var(--icon-cutout)" />

  <!-- Inner Iris Accent -->
  <circle cx="49" cy="60" r="6.5" fill="var(--icon-iris)" />

  <!-- Live Broadcast Beacon -->
  <circle cx="106" cy="22" r="5" fill="var(--icon-beacon)" />
</svg>
